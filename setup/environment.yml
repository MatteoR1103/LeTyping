name: rl-project
channels:
  - conda-forge
  - defaults

dependencies:
  # Intended primarily for Linux/WSL.
  # Native Windows + placo/lerobot kinematics is not reliable
  - python=3.12

  - numpy
  - scipy
  - matplotlib

  - pyyaml
  - pinocchio

  - pip
  - pip:
      - "lerobot[placo-dep,feetech]"
      - openai
      - google-genai
      - opencv-python
      # Optional local OCR backend used only with main_pipeline.py --ocr:
      # - easyocr
