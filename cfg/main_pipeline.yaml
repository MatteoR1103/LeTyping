tasks:
  1:
    provider: openai
    model: gpt-5.5
    list_path: key_sequence/task_1.txt
    prompt_context: "Task 1 success is pressing SPACE, ENTER, R, and L sequentially and in that order."
    prompt_instructions:
      - "SPACE means the keyboard spacebar key; locate its middle point, not one of its edges."
      - "Locate the center of the word Enter on the ENTER key."
      - "For R, use the surrounding QWERTY layout to disambiguate it: R is between E and T, above-left of F, and above-right of D."
      - "Return the center of the physical key surface, not the printed glyph."
  2:
    provider: gemini
    model: gemini-3-flash-preview
    list_path: key_sequence/task_2.txt
  3:
    provider: openai
    model: gpt-5.5
    list_path: key_sequence/task_3.txt

# Save localization/debug screenshots under camera/ during pipeline runs.
capture_screens: false

# Home joint configuration in degrees, ordered as:
# shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper.
# Key is at 7.5 cm from the robot
home_position_deg:
  - 6.065934
  - -66.461538
  - 62.285714
  - 74.10989
  - -89.714286
  - 50.0

# Physical SO-101 follower connection and calibration identity.
robot:
  # Serial device used to connect to the follower arm.
  port: /dev/ttyACM0
  # Follower calibration file; the filename stem is used as the robot id.
  calibration_path: cfg/calibration/follower/zi_padrone.json

# Internal motor-bus PID gains written before the outer trajectory controller runs.
internal_controller:
  # Internal proportional gain for each motor.
  p_coefficient: 20
  # Internal integral gain for each motor.
  i_coefficient: 1
  # Internal derivative gain for each motor.
  d_coefficient: 16

# Camera capture and keyboard-plane assumptions.
camera:
  # OpenCV camera index.
  index: 4
  # OpenCV backend name: auto, dshow, msmf, or any.
  backend: auto
  # Keyboard plane height in world coordinates, in metres.
  keyboard_height: 0.02

tracking:
  # Keys whose estimate should be held after initial localization instead of using KLT.
  disable_klt_for:
    - SPACE

# VLM localization settings for the initial key detection.
gemini:
  # Localization provider: openai or gemini.
  provider: openai
  # Model name used for localization. For provider: gemini, omit --model to use gemini-3-flash-preview.
  model: gpt-5.5
  # Vertex AI traffic mode for Gemini: standard, priority, or provisioned. Ignored by OpenAI.
  backend: standard
  # Google Cloud project for Gemini; null falls back to GOOGLE_CLOUD_PROJECT.
  project: null
  # Google Cloud location for Gemini; global is usually right for Gemini preview models.
  location: global

# Robot model and end-effector frame settings.
kinematics:
  # URDF used for forward/inverse kinematics.
  urdf_path: cfg/arm_model/so101_new_calib.urdf
  # URDF frame treated as the physical key-contact point.
  press_ee_frame: key_contact_frame_link

# Trajectory generation, adaptive hover refinement, and key pressing parameters.
trajectory:
  # Hover offset above the estimated key position, in metres.
  hover_height: 0.03
  # Distance below the estimated key plane to press, in metres.
  press_depth: 0.01
  # Maximum duration for approach/final travel segments, in seconds.
  travel_duration: 0.6
  # Fixed duration for the descent/key press segment, in seconds.
  press_duration: 0.6
  # Approximate Cartesian speed for approach/refinement moves, in m/s.
  approach_speed: 0.1
  # Minimum duration for normal generated spline segments, in seconds.
  min_segment_duration_default: 0.4
  # Maximum number of adaptive hover-refinement moves before pressing.
  max_refine_steps: 3
  # Stop hover refinement when end-effector/key XY error is below this many metres.
  refine_xy_threshold: 0.002
  # Require recent key XY estimates to vary less than this many metres.
  estimate_stability_threshold: 0.002
  # Minimum duration for shorter hover-refinement segments after the first one.
  shorter_segment_duration: 0.2
  # XY offset added to the hover target before pressing, in metres.
  hover_offset_xy:
    - 0.01
    - 0.0
  # Height multiplier used on the first tracked hover approach.
  first_hover_height_scale: 1.5
  # Maximum refinement moves when tracking is locked or disabled.
  locked_refine_steps: 2
  # Hold multiplier when returning home after a press.
  final_home_hold_multiplier: 5.0
  # Hold multiplier when returning only to hover after a press.
  final_hover_hold_multiplier: 2.0

# Grouping and correction settings for clustered key tracking.
cluster:
  # World-space radius used to group nearby future letters for continuous tracking.
  tracking_radius: 0.02
  # Minimum enforced distance between frozen clustered key positions, in metres.
  min_distance: 0.015
  # Maximum x-axis offset allowed between a clustered key and its anchor, in metres.
  max_horizontal_delta: 0.022
  # Maximum y-axis offset allowed between a clustered key and its anchor, in metres.
  max_vertical_delta: 0.014
  # Keys that should be handled alone instead of grouped into tracking clusters.
  excluded_letters:
    - SPACE

# Small workflow timing delays around homing and final tracking updates.
timing:
  # Seconds to wait after the initial go-home move before starting tracking.
  initial_home_sleep_s: 2.0
  # Seconds to keep updating the tracker after returning home at the end of a run.
  post_run_tracker_update_s: 1.0
